<!DOCTYPE html>
<html>
<body>
<!-- Hidden form declaration for Netlify Forms detection at build time -->
<form name="sample-request" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
  <input type="text" name="name" />
  <input type="email" name="email" />
  <input type="text" name="address" />
  <input type="text" name="style" />
  <textarea name="notes"></textarea>
</form>
</body>
</html>
